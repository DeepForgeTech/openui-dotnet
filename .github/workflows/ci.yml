name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Makes the packed assemblies and symbols deterministic, so they match what a build of the same commit gives.
  ContinuousIntegrationBuild: true

jobs:
  # Once per MudBlazor line OpenUI.Lang.Blazor.Mud ships for. The other packages build the same on every line, so only the
  # first line uploads them; the others upload their OpenUI.Lang.Blazor.Mud alone.
  build:
    name: build (MudBlazor ${{ matrix.mudblazor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mudblazor: 9.11.0
            packages: artifacts/*
          - mudblazor: 8.10.0
            packages: artifacts/OpenUI.Lang.Blazor.Mud.*
    # MSBuild reads this as the MudBlazorVersion property, so every build, test and pack below is on this line.
    env:
      MudBlazorVersion: ${{ matrix.mudblazor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OpenUI.Lang.sln --configuration Release

      - name: Test
        run: dotnet test OpenUI.Lang.sln --configuration Release --no-build --blame-hang-timeout 5m

      - name: Pack
        run: dotnet pack OpenUI.Lang.sln --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages-mudblazor-${{ matrix.mudblazor }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
