name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Makes the packed assemblies and symbols deterministic, so they match what a build of the same commit gives.
  ContinuousIntegrationBuild: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OpenUI.Lang.sln --configuration Release

      - name: Test
        run: dotnet test OpenUI.Lang.sln --configuration Release --no-build --blame-hang-timeout 5m

      - name: Pack
        run: dotnet pack OpenUI.Lang.sln --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error
